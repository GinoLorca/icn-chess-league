name: Update league data

on:
  schedule:
    # Daily at 09:23 UTC (~5:23am ET) -- off an exact hour mark on purpose.
    - cron: "23 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live standings and regenerate index.html
        run: python3 scripts/update_league_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes to league data."
            exit 0
          fi
          git add index.html
          git commit -m "Auto-update league data from icnadmin.com/League2026.html ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
