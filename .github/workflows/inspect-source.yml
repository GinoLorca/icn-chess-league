name: Inspect League2026 source
on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and dump structure
        run: |
          curl -sL -o page.html "https://icnadmin.com/League2026.html"
          echo "=== byte size ==="
          wc -c page.html
          echo "=== first 400 lines ==="
          head -n 400 page.html
