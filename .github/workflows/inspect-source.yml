name: Inspect League2026 source
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source and commit a snapshot for inspection
        run: |
          mkdir -p debug
          curl -sL -o debug/league2026-snapshot.html "https://icnadmin.com/League2026.html"
          wc -c debug/league2026-snapshot.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug/league2026-snapshot.html
          git commit -m "Debug: snapshot League2026.html for inspection" || echo "nothing to commit"
          git push
